services:
  - type: web
    name: trustworthy-verifiable-ai-backend
    runtime: python
    rootDir: trustworthy_verifiable_ai
    buildCommand: pip install -r backend/requirements.txt
    startCommand: PYTHONPATH=backend python -m app.db.seed && PYTHONPATH=backend uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: SARVAM_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: sarvam
